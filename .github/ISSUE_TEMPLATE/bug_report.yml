name: Bug report
description: Something in usturlab behaves differently than documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Found a **security** problem instead? Don't file it here — see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Which provider was involved
      description: Pick the one the task was routed to. Choose "several / routing itself" if the bug is in the router or failover.
      multiple: true
      options:
        - Claude Code
        - Codex (ChatGPT)
        - Gemini CLI
        - GitHub Copilot
        - OpenRouter
        - several / routing itself
        - not provider-specific
    validations:
      required: true

  - type: input
    id: cli-version
    attributes:
      label: Provider CLI version
      description: "Output of e.g. `claude --version`, `codex --version`. Adapters parse CLI output, so the version usually matters."
      placeholder: "claude 2.1.216"

  - type: input
    id: extension-version
    attributes:
      label: usturlab version
      description: From the Extensions view, or the top of CHANGELOG.md.
      placeholder: "0.8.2"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: OS and VS Code version
      placeholder: "macOS 15.2, VS Code 1.96.0"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: |
        Output panel (**usturlab**), or the terminal in terminal mode.
        Scrub tokens, API keys and anything private before pasting — they will be public.
      render: text

  - type: textarea
    id: rules
    attributes:
      label: Your .usturlab/rules.json
      description: Only if the bug involves routing. Account names may be replaced with placeholders.
      render: json
