name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows earns its slot: path handling and profile directories are the
        # parts most likely to differ, and nothing else here would catch them.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: VS Code smoke test (linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a pnpm -C packages/vscode test:vscode
      - name: VS Code smoke test (macos, windows)
        if: matrix.os != 'ubuntu-latest'
        run: pnpm -C packages/vscode test:vscode
      - name: Package .vsix
        if: matrix.os == 'ubuntu-latest'
        run: pnpm -C packages/vscode package
      - name: Upload .vsix artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: usturlab-vsix
          path: packages/vscode/*.vsix
